    name: "Eleusis"
    description: "Eleusis is an industrial city located 23km from Athens, Greece. Despite being a natural harbor and a cultural center, the city's image is negatively overshadowed by the severe environmental pollution it suffered in the 1960s and 1970s as it was the host of heavy industry like refineries, shipyards, and cement factories for decades. This persistent stereotype discourages visitors and masks the city's modern reality and cultural significance."

